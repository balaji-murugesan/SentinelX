# Alembic (database migrations). Run through `uv run alembic ...` or the `migrate` service.
[alembic]
script_location = src/engine/persistence/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os

# The database URL is deliberately NOT here. env.py reads MIGRATE_DATABASE_URL (a secret that
# belongs in .env, and that only the migrate role/service uses).
