# CI: every push to main and every pull request must pass all of these (CLAUDE.md
# "Definition of done"). Two jobs:
#   checks  - format, lint, strict types, import boundaries, all tests (including the Redis
#             and Postgres integration tests, which refuse to skip when CI=true), OpenSpec
#   stack   - builds and starts the whole Compose stack and runs scripts/smoke_test.py
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.33"
  OPENSPEC_VERSION: "1.15.0"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sentinelx_test
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinelx_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Database 15 only: the integration tests wipe it.
      TEST_REDIS_URL: redis://localhost:6379/15
      # A throwaway *_test database: the trading-state tests migrate and truncate it.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@localhost:5432/sentinelx_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies (exactly as locked)
        run: uv sync --frozen

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check (strict)
        run: uv run mypy src

      - name: Import boundaries
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest -ra

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: OpenSpec
        run: |
          npm install -g "@fission-ai/openspec@${OPENSPEC_VERSION}"
          openspec validate --all --strict

  stack:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create .env with throwaway passwords
        # Random per run, masked in the log, discarded with the runner. Never real credentials.
        run: |
          cp .env.example .env
          for name in POSTGRES_PASSWORD ENGINE_DB_PASSWORD MIGRATE_DB_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            sed -i "s/^${name}=.*/${name}=${value}/" .env
          done

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: uv run python scripts/smoke_test.py

      - name: Show state and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
